    <style>
        /* Thiết lập zoom mặc định 110% cho toàn bộ website */
        html {
            zoom: 111%;
        }


        .font-inter {
            font-family: 'Inter', sans-serif;
        }

        .font-roboto {
            font-family: 'Roboto', sans-serif;
        }

        .font-sf-pro {
            font-family: 'SF Pro Display', sans-serif;
        }

        /* Custom gradients and effects */
        .gradient-blue {
            background: linear-gradient(135deg, #28c828 0%, #32d74b 100%);
        }

        .glass-effect {
            backdrop-filter: blur(2px);
            background: linear-gradient(180deg, rgba(200, 255, 200, 0.3) 0%, rgba(160, 240, 160, 0.3) 100%);
        }

        .button-glow {
            box-shadow: 0px 4px 10px 0px rgba(40, 200, 60, 0.28);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0px 8px 25px 0px rgba(40, 200, 60, 0.35);
        }

        /* Background Animation Styles cho mockup container */
        .mockup-background-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 20px;
        }

        .background-slide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: 90%;
            height: 90%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.85;
            border-radius: 20px;
            filter: none;
        }

        /* Animation chính cho background - xoay đều đặn và liên tục */
        @keyframes backgroundAnimation {
            0% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 0.85;
            }

            12.5% {
                transform: translate(-50%, -50%) scale(1.05) rotate(45deg);
                opacity: 0.9;
            }

            25% {
                transform: translate(-50%, -50%) scale(1.1) rotate(90deg);
                opacity: 0.95;
            }

            37.5% {
                transform: translate(-50%, -50%) scale(1.05) rotate(135deg);
                opacity: 0.9;
            }

            50% {
                transform: translate(-50%, -50%) scale(0.95) rotate(180deg);
                opacity: 0.85;
            }

            62.5% {
                transform: translate(-50%, -50%) scale(0.9) rotate(225deg);
                opacity: 0.9;
            }

            75% {
                transform: translate(-50%, -50%) scale(0.95) rotate(270deg);
                opacity: 0.95;
            }

            87.5% {
                transform: translate(-50%, -50%) scale(1) rotate(315deg);
                opacity: 0.9;
            }

            100% {
                transform: translate(-50%, -50%) scale(1) rotate(360deg);
                opacity: 0.85;
            }
        }

        .background-slide.active {
            animation: backgroundAnimation 6s linear infinite;
        }

        /* Animation xoay liên tục và mượt mà */
        @keyframes continuousRotation {
            from {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) scale(1) rotate(360deg);
            }
        }

        /* Animation zoom nhẹ */
        @keyframes gentleZoom {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        .background-slide.zoom {
            animation: gentleZoom 4s ease-in-out infinite;
        }

        /* Animation xoay liên tục */
        .background-slide.continuous-rotate {
            animation: continuousRotation 8s linear infinite;
        }

        /* Animation opacity nhẹ nhàng */
        @keyframes gentleOpacity {

            0%,
            100% {
                opacity: 0.85;
            }

            50% {
                opacity: 0.95;
            }
        }

        .background-slide.opacity {
            animation: gentleOpacity 3s ease-in-out infinite;
        }

        /* Background images không có màu nền */
        .bg-overlay-1 {
            background-image: url('./assets/img/feature/backgroupf1.png');
        }

        /* Tối ưu hóa performance */
        .background-slide {
            will-change: transform, opacity;
        }

        /* Responsive background */
        @media (max-width: 768px) {
            .background-slide {
                background-position: center;
            }
        }

        /* Modal styles */
        .modal-base {
            transition: all 0.3s ease;
        }

        .modal-base.hidden {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }

        .modal-base:not(.hidden) {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
        }

        /* Desktop modal styles */
        @media (min-width: 768px) {
            .modal-base {
                background: transparent !important;
                pointer-events: none;
            }

            .modal-base .fixed {
                animation: slideInFromBottom 0.3s ease-out;
                pointer-events: auto;
            }
        }

        @keyframes slideInFromBottom {
            from {
                transform: translateY(100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Mobile modal styles */
        @media (max-width: 767px) {
            .modal-base {
                display: flex !important;
                align-items: center;
                justify-content: center;
                background: rgba(0, 0, 0, 0.5) !important;
            }

            .modal-base .md\\:hidden {
                width: 100% !important;
                height: 100% !important;
                max-width: none !important;
                max-height: none !important;
                border-radius: 0 !important;
            }

            .modal-base .flex-1 {
                height: calc(100vh - 100px) !important;
            }

            .modal-base iframe {
                width: 100% !important;
                height: 100% !important;
                min-height: 100% !important;
            }
        }
    </style>
</head>

    <!-- Modal Manager JavaScript -->
    <script>
        class ModalManager {
            constructor() {
                this.modals = [
                    {
                        btnClass: '.naptien-btn',
                        modalId: 'naptienModal',
                        closeMobileId: 'closeNaptienModal',
                        closeDesktopId: 'closeNaptienModalDesktop',
                        title: 'Nạp tiền'
                    },
                    {
                        btnClass: '.ruttien-btn',
                        modalId: 'ruttienModal',
                        closeMobileId: 'closeRuttienModal',
                        closeDesktopId: 'closeRuttienModalDesktop',
                        title: 'Rút tiền'
                    },
                    {
                        btnClass: '.khuyenmai-btn',
                        modalId: 'khuyenmaiModal',
                        closeMobileId: 'closeKhuyenmaiModal',
                        closeDesktopId: 'closeKhuyenmaiModalDesktop',
                        title: 'Khuyến mãi'
                    },
                    {
                        btnClass: '.khieunai-btn',
                        modalId: 'khieunaiModal',
                        closeMobileId: 'closeKhieunaiModal',
                        closeDesktopId: 'closeKhieunaiModalDesktop',
                        title: 'Khiếu nại'
                    },
                    {
                        btnClass: '.taikhoan-btn',
                        modalId: 'taikhoanModal',
                        closeMobileId: 'closeTaikhoanModal',
                        closeDesktopId: 'closeTaikhoanModalDesktop',
                        title: 'Tài khoản'
                    }
                ];
                this.init();
            }

            closeAll() {
                this.modals.forEach(config => {
                    const modal = document.getElementById(config.modalId);
                    if (modal) {
                        modal.classList.add('hidden');
                        modal.style.display = 'none';
                    }
                });
                document.body.style.overflow = 'auto';
            }

            openModal(modalId) {
                this.closeAll();
                const modal = document.getElementById(modalId);
                if (modal) {
                    modal.classList.remove('hidden');
                    modal.style.display = 'block';
                    if (window.innerWidth < 768) {
                        document.body.style.overflow = 'hidden';
                    }
                }
            }

            closeModal(modalId) {
                const modal = document.getElementById(modalId);
                if (modal) {
                    modal.classList.add('hidden');
                    modal.style.display = 'none';
                    if (window.innerWidth < 768) {
                        document.body.style.overflow = 'auto';
                    }
                }
            }

            init() {
                this.modals.forEach(config => {
                    const btns = document.querySelectorAll(config.btnClass);
                    const closeMobile = document.getElementById(config.closeMobileId);
                    const closeDesktop = document.getElementById(config.closeDesktopId);

                    if (!btns.length || !closeMobile || !closeDesktop) {
                        console.error(`Missing elements for ${config.title} modal`);
                        return;
                    }

                    // Open modal - xử lý click cho hình ảnh
                    const openModalHandler = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        console.log(`Nút ${config.title} được click`);
                        this.openModal(config.modalId);
                    };

                    // Thêm event listener cho tất cả hình ảnh có class naptien-btn
                    btns.forEach(btn => {
                        btn.addEventListener('click', openModalHandler);
                    });

                    // Close modal
                    const closeModal = () => this.closeModal(config.modalId);
                    closeMobile.addEventListener('click', closeModal);
                    closeDesktop.addEventListener('click', closeModal);

                    // Close on outside click (mobile only)
                    const modal = document.getElementById(config.modalId);
                    modal.addEventListener('click', (e) => {
                        if (e.target === modal && window.innerWidth < 768) {
                            closeModal();
                        }
                    });

                    // Close on ESC
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                            closeModal();
                        }
                    });

                    console.log(`${config.title} modal handler created successfully`);
                    console.log(`Found ${btns.length} buttons with class ${config.btnClass}`);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize modal manager
            const modalManager = new ModalManager();

            // Handle responsive resize
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768) {
                    document.body.style.overflow = 'auto';
                }
            });
        });
    </script>

    <script>
        $('.btn-reload').on('click', function () {
            // Get the iframe element using the selector in the data-tag-id attribute
            var iframeSelector = $(this).data('tag-id');
            var $iframe = $(iframeSelector); // Now $iframe is the jQuery object of the actual iframe
            
            // Get the current src of the iframe
            var iframeLoading = $iframe.attr('src');
            
            // Set the iframe src to empty, and reload it when the iframe loads
            $iframe.attr('src', '');
            $iframe.on('load', function () {
                $('#loading').hide(); // Hide loading indicator
            }).attr('src', iframeLoading); // Reset src to reload the iframe
        });

    </script>
